<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Leitura Acessível</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Topo: título e o "alfinete", que abre este mesmo painel fixo na
       barra lateral do navegador (ele não fecha ao clicar na página). -->
  <header class="topo">
    <h1>Leitura Acessível</h1>
    <button id="btn-fixar" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6v2l-1 1v5l3 3v2h-4v5l-1 1-1-1v-5H7v-2l3-3V6L9 5z"/></svg>
      <span id="btn-fixar-texto">Fixar</span>
    </button>
  </header>

  <!-- Avisos: página protegida, falta de permissão, aba antiga... -->
  <div id="aviso" class="aviso" role="status" hidden>
    <p id="aviso-texto"></p>
    <button id="btn-permitir" hidden>Permitir em todos os sites</button>
  </div>

  <!-- Chave geral: liga/desliga todos os ajustes (item 5) --------------->
  <button id="btn-geral" class="toggle-grande" aria-pressed="true">
    Ajustes: LIGADOS
  </button>

  <!-- Abas: dividem os controles em quatro telas curtas, para o popup
       caber na janela sem precisar rolar. Padrão de acessibilidade
       "tabs" (WAI-ARIA): setas ← → trocam de aba. -->
  <div class="abas" role="tablist" aria-label="Grupos de ajustes">
    <button role="tab" id="aba-texto" aria-controls="painel-texto" aria-selected="true">Texto</button>
    <button role="tab" id="aba-cores" aria-controls="painel-cores" aria-selected="false" tabindex="-1">Cores</button>
    <button role="tab" id="aba-voz" aria-controls="painel-voz" aria-selected="false" tabindex="-1">Voz</button>
    <button role="tab" id="aba-mais" aria-controls="painel-mais" aria-selected="false" tabindex="-1">Mais</button>
  </div>

  <!-- Aba 1: fonte, tamanho e espaçamentos (itens 1 e 2) -------------->
  <section id="painel-texto" role="tabpanel" aria-labelledby="aba-texto" tabindex="0">
    <button id="btn-fonte" class="toggle-grande" aria-pressed="true">
      OpenDyslexic: LIGADA
    </button>

    <!-- Cada slider tem um <label> e um <output> que mostra o valor. -->
    <div class="slider">
      <label for="fontSize">Tamanho do texto</label>
      <output for="fontSize" id="fontSize-valor"></output>
      <input type="range" id="fontSize" min="80" max="200" step="10">
    </div>

    <div class="slider">
      <label for="lineHeight">Espaço entre linhas</label>
      <output for="lineHeight" id="lineHeight-valor"></output>
      <input type="range" id="lineHeight" min="1" max="3" step="0.1">
    </div>

    <div class="slider">
      <label for="letterSpacing">Espaço entre letras</label>
      <output for="letterSpacing" id="letterSpacing-valor"></output>
      <input type="range" id="letterSpacing" min="0" max="0.3" step="0.02">
    </div>

    <div class="slider">
      <label for="wordSpacing">Espaço entre palavras</label>
      <output for="wordSpacing" id="wordSpacing-valor"></output>
      <input type="range" id="wordSpacing" min="0" max="0.6" step="0.04">
    </div>

    <button id="btn-wcag" class="largo" title="Valores da norma de acessibilidade WCAG 2.1, critério 1.4.12">Espaçamento recomendado</button>
  </section>

  <!-- Aba 2: cores (item 3) ------------------------------------------->
  <section id="painel-cores" role="tabpanel" aria-labelledby="aba-cores" tabindex="0" hidden>
    <!-- Os botões de cor são gerados pelo popup.js a partir de
         LA.COLOR_SCHEMES (shared/settings.js). -->
    <div id="cores" class="grade-cores" role="group" aria-label="Cores de fundo e texto"></div>

    <div id="cores-personalizadas" class="cores-personalizadas" hidden>
      <label>Fundo <input type="color" id="customBg"></label>
      <label>Texto <input type="color" id="customFg"></label>
    </div>
  </section>

  <!-- Aba 3: leitura em voz alta (item 4) ----------------------------->
  <section id="painel-voz" role="tabpanel" aria-labelledby="aba-voz" tabindex="0" hidden>
    <!-- Os ícones são desenhos SVG (não dependem de fonte) e têm
         aria-hidden: o leitor de tela lê só o texto do botão. -->
    <div class="linha-botoes">
      <button id="btn-ler-selecao">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>
        Ler seleção
      </button>
      <button id="btn-ler-pagina">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>
        Ler página
      </button>
    </div>
    <div class="linha-botoes">
      <button id="btn-pausar" disabled>
        <svg class="ic-pausar" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
        <svg class="ic-continuar" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>
        <span id="btn-pausar-texto">Pausar</span>
      </button>
      <button id="btn-parar" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v14H5z"/></svg>
        Parar
      </button>
    </div>

    <!-- aria-live: leitores de tela anunciam quando o texto muda. -->
    <p id="voz-estado" class="dica" aria-live="polite">Parado.</p>

    <div class="slider">
      <label for="ttsRate">Velocidade</label>
      <output for="ttsRate" id="ttsRate-valor"></output>
      <input type="range" id="ttsRate" min="0.5" max="2" step="0.1">
    </div>

    <label class="campo" for="ttsVoice">Voz</label>
    <select id="ttsVoice">
      <option value="">Automática (português do Brasil)</option>
    </select>
    <p id="voz-aviso" class="dica" hidden></p>
  </section>

  <!-- Aba 4: apoios de leitura ---------------------------------------->
  <section id="painel-mais" role="tabpanel" aria-labelledby="aba-mais" tabindex="0" hidden>
    <!-- Cada apoio é uma caixa de seleção com uma explicação curta.
         O id de cada <input> é o nome da configuração. -->
    <label class="opcao">
      <input type="checkbox" id="readingRuler">
      <span><strong>Régua de leitura</strong>
        <small>Faixa que segue o mouse.</small></span>
    </label>
    <label class="opcao">
      <input type="checkbox" id="alignLeft">
      <span><strong>Alinhar à esquerda</strong>
        <small>Tira o texto justificado.</small></span>
    </label>
    <label class="opcao">
      <input type="checkbox" id="shortLines">
      <span><strong>Linhas mais curtas</strong>
        <small>Até 70 letras por linha.</small></span>
    </label>
    <label class="opcao">
      <input type="checkbox" id="plainText">
      <span><strong>Sem itálico e maiúsculas</strong>
        <small>Itálico vira negrito.</small></span>
    </label>
  </section>

  <!-- Rodapé: desligar só neste site e restaurar padrão (item 5) ------->
  <p id="site-atual" class="dica" hidden></p>
  <div class="linha-botoes rodape">
    <button id="btn-site" aria-pressed="false" hidden>Desligar neste site</button>
    <button id="btn-restaurar">Restaurar padrão</button>
  </div>

  <script src="../shared/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
